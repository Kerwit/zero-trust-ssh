[package]
name = "sshd-epoch-auth"
version = "0.2.0"
edition = "2021"
description = "Zero-Trust Stateless OpenSSH AuthorizedKeysCommand validator (60m HKDF-Ed25519)"

[dependencies]
ed25519-dalek = "2.1"
ssh-key = { version = "0.6", features = ["ed25519"] }
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1.8"

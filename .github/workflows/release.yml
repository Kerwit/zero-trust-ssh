name: Release Multi-Platform CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plataformas a ejecutar (all, linux, macos, windows)"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - linux
          - macos
          - windows
      publish:
        description: "Publicar/actualizar GitHub Release"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag del release (vacío = v<version> de ssh-usb-unlock/Cargo.toml)"
        required: false
        default: ""
      prerelease:
        description: "Marcar como prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve target platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          ALL='[
            {"platform":"linux","os":"ubuntu-latest","targets":"x86_64-unknown-linux-musl aarch64-unknown-linux-musl","use_zig":true,"archive_ext":"tar.gz"},
            {"platform":"macos","os":"macos-latest","targets":"aarch64-apple-darwin x86_64-apple-darwin","use_zig":false,"archive_ext":"tar.gz"},
            {"platform":"windows","os":"windows-latest","targets":"x86_64-pc-windows-msvc aarch64-pc-windows-msvc","use_zig":false,"archive_ext":"zip"}
          ]'
          if [[ "$SELECTED" == "all" ]]; then
            MATRIX="$(jq -c '.' <<< "$ALL")"
          else
            MATRIX="$(jq -c --arg p "$SELECTED" '[.[] | select(.platform == $p)]' <<< "$ALL")"
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: ${MATRIX}"

  test:
    name: Test (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        id: rust
        shell: bash
        run: bash scripts/ci/setup-rust.sh

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ steps.rust.outputs.rustc_hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ steps.rust.outputs.rustc_hash }}-

      - name: Run unit tests (Unix workspace)
        if: runner.os != 'Windows'
        run: cargo test --workspace

      - name: Run unit tests (Windows CLI)
        if: runner.os == 'Windows'
        run: cargo test -p ssh-usb-unlock

      - name: Validate shell scripts syntax
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          bash -n scripts/ci/setup-rust.sh
          bash -n scripts/ci/clean-cargo-cache.sh
          bash -n scripts/ci/install-zig-tools.sh

      - name: Smoke test CLI self-install & link (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p ssh-usb-unlock
          TMP_SSH="$(mktemp -d)"
          trap 'rm -rf "$TMP_SSH"' EXIT
          export ZT_SSH_DIR="$TMP_SSH"
          ./target/debug/ssh-usb-unlock --version
          ./target/debug/ssh-usb-unlock install --no-path
          test -x "$TMP_SSH/ssh-usb-unlock"
          "$TMP_SSH/ssh-usb-unlock" link \
            --host 192.168.1.33 --port 22 --alias ci-srv \
            --host-id cisrv --user ubuntu --generation 1 \
            --skip-keyscan --skip-test --no-interactive
          "$TMP_SSH/ssh-usb-unlock" list | grep -q "ci-srv"
          "$TMP_SSH/ssh-usb-unlock" unlink ci-srv
          "$TMP_SSH/ssh-usb-unlock" uninstall --keep-path
          test ! -e "$TMP_SSH/ssh-usb-unlock"

      - name: Smoke test CLI self-install & link (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p ssh-usb-unlock
          $tmpSsh = Join-Path ([System.IO.Path]::GetTempPath()) ("zt-ssh-ci-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmpSsh -Force | Out-Null
          try {
            $env:ZT_SSH_DIR = $tmpSsh
            .\target\debug\ssh-usb-unlock.exe --version
            .\target\debug\ssh-usb-unlock.exe install --no-path
            $installed = Join-Path $tmpSsh "ssh-usb-unlock.exe"
            if (-not (Test-Path $installed)) { throw "Binary not installed at $installed" }
            & $installed link --host 192.168.1.33 --port 22 --alias ci-srv --host-id cisrv --user ubuntu --generation 1 --skip-keyscan --skip-test --no-interactive
            $listed = & $installed list
            if (-not ($listed -match "ci-srv")) { throw "ci-srv not listed" }
            & $installed unlink ci-srv
            .\target\debug\ssh-usb-unlock.exe uninstall --keep-path
            if (Test-Path $installed) { throw "Binary still exists after uninstall" }
          } finally {
            Remove-Item -Path $tmpSsh -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Clean workspace artifacts before cache save
        shell: bash
        run: bash scripts/ci/clean-cargo-cache.sh

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (${{ matrix.platform }})
        id: rust
        shell: bash
        run: |
          ARGS=()
          for t in ${{ matrix.targets }}; do
            ARGS+=(--target "$t")
          done
          bash scripts/ci/setup-rust.sh "${ARGS[@]}"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.platform }}-${{ steps.rust.outputs.rustc_hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.platform }}-${{ steps.rust.outputs.rustc_hash }}-

      - name: Cache Zig & cargo-zigbuild tools
        if: matrix.use_zig
        uses: actions/cache@v4
        with:
          path: ~/.local/zig-tools
          key: ${{ runner.os }}-zig-tools-${{ hashFiles('scripts/ci/install-zig-tools.sh') }}

      - name: Setup Zig & cargo-zigbuild
        if: matrix.use_zig
        shell: bash
        run: bash scripts/ci/install-zig-tools.sh

      - name: Cache Zig & cargo-zigbuild build cache
        if: matrix.use_zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/.cache/cargo-zigbuild
          key: ${{ runner.os }}-zig-build-cache-${{ matrix.platform }}-${{ hashFiles('scripts/ci/install-zig-tools.sh', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-zig-build-cache-${{ matrix.platform }}-

      - name: Build & package Unix targets
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for TARGET in ${{ matrix.targets }}; do
            echo "::group::Building ${TARGET}"
            if [[ "${{ matrix.use_zig }}" == "true" ]]; then
              cargo zigbuild --release -p ssh-usb-unlock --target "$TARGET"
            else
              cargo build --release -p ssh-usb-unlock --target "$TARGET"
            fi
            BIN="target/${TARGET}/release/ssh-usb-unlock"
            chmod 755 "$BIN"
            tar -czf "dist/ssh-usb-unlock-${TARGET}.tar.gz" -C "target/${TARGET}/release" ssh-usb-unlock
            echo "::endgroup::"
          done

      - name: Build & package Windows targets
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          foreach ($target in ("${{ matrix.targets }}" -split '\s+')) {
            Write-Host "::group::Building $target"
            cargo build --release -p ssh-usb-unlock --target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive `
              -Path "target\$target\release\ssh-usb-unlock.exe" `
              -DestinationPath "dist\ssh-usb-unlock-$target.zip" `
              -Force
            Write-Host "::endgroup::"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-usb-unlock-${{ matrix.platform }}
          path: dist/ssh-usb-unlock-*.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Clean workspace artifacts before cache save
        shell: bash
        run: |
          ARGS=(--release)
          for t in ${{ matrix.targets }}; do
            ARGS+=(--target "$t")
          done
          bash scripts/ci/clean-cargo-cache.sh "${ARGS[@]}"

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            VER="$(grep -m1 '^version' ssh-usb-unlock/Cargo.toml | cut -d'"' -f2)"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Include installer scripts & compute SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          chmod 755 dist/install.sh

          NEW_SUMS="$(mktemp)"
          EXISTING_SUMS="$(mktemp)"
          trap 'rm -f "$NEW_SUMS" "$EXISTING_SUMS"' EXIT

          (
            cd dist
            FILES=(ssh-usb-unlock-*.tar.gz ssh-usb-unlock-*.zip install.sh install.ps1)
            sha256sum "${FILES[@]}" > "$NEW_SUMS"
          )

          if [[ "$PLATFORMS" != "all" ]] && gh release download "$TAG" -p "SHA256SUMS.txt" -O "$EXISTING_SUMS" 2>/dev/null; then
            NEW_NAMES="$(awk '{print $2}' "$NEW_SUMS")"
            {
              while IFS= read -r line; do
                fname="$(awk '{print $2}' <<< "$line")"
                if [[ -n "$fname" ]] && ! grep -Fqx "$fname" <<< "$NEW_NAMES"; then
                  echo "$line"
                fi
              done < "$EXISTING_SUMS"
              cat "$NEW_SUMS"
            } | sort -k2 > dist/SHA256SUMS.txt
          else
            sort -k2 "$NEW_SUMS" > dist/SHA256SUMS.txt
          fi
          cat dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat <<EOF > "$NOTES_FILE"
          ## Instalación rápida (auto-instalable en tu directorio SSH)

          ### macOS & Linux (\`~/.ssh/ssh-usb-unlock\`)
          \`\`\`sh
          curl -fsSL https://github.com/${REPO}/releases/download/${TAG}/install.sh | sh
          \`\`\`

          ### Windows (\`%USERPROFILE%\\.ssh\\ssh-usb-unlock.exe\`)
          \`\`\`cmd
          curl.exe -fsSL https://github.com/${REPO}/releases/download/${TAG}/install.ps1 | powershell -NoProfile -ExecutionPolicy Bypass -Command -
          \`\`\`
          *(o en PowerShell: \`irm https://github.com/${REPO}/releases/download/${TAG}/install.ps1 | iex\`)*

          ## Vincular con la app (LittleKey)
          \`\`\`sh
          ssh-usb-unlock link
          \`\`\`

          Otros comandos disponibles: \`list\`, \`unlink <alias>\`, \`test <alias>\`, \`doctor\`, \`install\`, \`uninstall\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            EXTRA_ARGS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --title "Zero-Trust SSH CLI ${TAG}" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA_ARGS[@]}"
          fi
